<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Samaaj - Community Complaint Management</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="A platform for managing community complaints and issues">
    <meta name="theme-color" content="#FFB347">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Samaaj">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512-maskable.png">
    <link rel="apple-touch-icon" href="/icons/icon-512x512-maskable.png">
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect width="100" height="100" fill="%23FFB347"/%3E%3Ctext x="50" y="60" font-size="50" text-anchor="middle" fill="%231a1a1a" font-family="Arial, Helvetica, sans-serif"%3ES%3C/text%3E%3C/svg%3E'>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Force Cache Invalidation -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
      // One-time Nuclear Cache Clear for Deployment v5
      (function() {
        const VERSION = 'Samaaj_v5_Force_Reload';
        if (localStorage.getItem('DEPLOY_VERSION') !== VERSION) {
          console.warn('New Version Detected: Performing Nuclear Cache Clear...');
          localStorage.clear();
          sessionStorage.clear();
          if (window.caches) {
            caches.keys().then(names => {
              for (let name of names) caches.delete(name);
            });
          }
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (let reg of regs) reg.unregister();
            });
          }
          localStorage.setItem('DEPLOY_VERSION', VERSION);
          // Hard reload from server
          window.location.reload(true);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Global Emergency Fix for "FiMapPin is not defined" stale bundle errors
      window.onerror = function(msg, url, line, col, error) {
        if (typeof msg === 'string' && msg.indexOf('FiMapPin') !== -1) {
          console.error('Critical Cache Error: FiMapPin detected. Purging storage and reloading...');
          if (window.localStorage) localStorage.clear();
          if (window.sessionStorage) sessionStorage.clear();
          if (window.caches) {
            caches.keys().then(names => {
              for (let name of names) caches.delete(name);
            });
          }
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (let reg of regs) reg.unregister();
            });
          }
          setTimeout(() => {
            window.location.href = window.location.origin + window.location.pathname + '?refresh=' + Date.now();
          }, 100);
          return true;
        }
      };

      // Force unregister service worker if it exists (emergency measure)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Emergency SW Unregistration successful');
          }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
